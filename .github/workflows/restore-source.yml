name: Restore missing source files

on:
  workflow_dispatch:

permissions: {}

jobs:
  restore:
    if: github.repository == 'Zhenguo-RUI/work-language-observatory' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Verify archive and restore missing source files
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, subprocess, zipfile
          
          archive = Path("work-language-observatory.zip")
          expected_sha = "d783f7ec97363b3d5fd52ff93a8bd67016376e69c9d9b702ed0eebd9883515df"
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected_sha:
              raise SystemExit("Archive differs from the verified source delivery. No files were imported.")
          entries = []
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  if item.is_dir():
                      continue
                  parts = PurePosixPath(item.filename).parts
                  if len(parts) < 2 or parts[0] != "work-language-observatory" or any(p in ("", ".", "..") for p in parts):
                      raise SystemExit("Unexpected archive path")
                  rel = Path(*parts[1:])
                  if any(p in (".git", "node_modules", ".dev.vars", ".env") for p in rel.parts):
                      raise SystemExit("Unexpected private/runtime path")
                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit("Archive symlinks are not accepted")
                  target = Path.cwd() / rel
                  if not target.resolve().is_relative_to(Path.cwd().resolve()):
                      raise SystemExit("Unsafe destination")
                  content = z.read(item.filename)
                  if target.exists() and (target.is_symlink() or not target.is_file()):
                      raise SystemExit("Unexpected existing path: " + str(rel))
                  if target.exists() and target.read_bytes() != content and str(rel) != "README.md":
                      raise SystemExit("Existing file has other changes; review before importing: " + str(rel))
                  entries.append((rel, content))
          if len(entries) != 157:
              raise SystemExit("Unexpected source file count")
          created = []
          for rel, content in entries:
              target = Path.cwd() / rel
              if target.exists():
                  continue
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
              if str(rel).endswith((".sh", ".command")):
                  target.chmod(0o755)
              created.append(str(rel))
          removed = []
          expected_content = {str(rel): content for rel, content in entries}
          misplaced = {
              "globals.css": ["app/globals.css"],
              "route.ts": ["app/api/[...path]/route.ts"],
              "page.tsx": ["app/page.tsx", "app/ops/page.tsx"],
          }
          for old, candidates in misplaced.items():
              old_path = Path(old)
              if old_path.is_file() and not old_path.is_symlink():
                  content = old_path.read_bytes()
                  if any(content == expected_content[name] and Path(name).read_bytes() == content for name in candidates):
                      old_path.unlink()
                      removed.append(old)
          if created:
              subprocess.run(["git", "add", "--", *created], check=True)
          if removed:
              subprocess.run(["git", "add", "-u", "--", *removed], check=True)
          print("Verified misplaced copies removed after restoration: " + str(len(removed)))
          print("Verified archive source files: 157")
          print("Missing files restored and staged: " + str(len(created)))
          for name in created:
              print(name)
          PYTHON
      - name: Commit restored files
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "All source files are already present."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Restore missing source files from verified delivery"
          git push origin HEAD:main
