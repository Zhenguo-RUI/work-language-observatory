              path=PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts, 'Unsafe path'
              assert name in NEW and name not in files, 'Unexpected or duplicate source file'
              body=z.read(entry)
              assert hashlib.sha256(body).hexdigest()==NEW[name], 'Source checksum mismatch'
              files[name]=body
          assert set(files)==set(NEW), 'Incomplete source release'
          # Verify every conflict before writing anything; keep all unrelated files untouched.
          for name in set(OLD)|set(NEW):
              p=root/name
              assert p.resolve().is_relative_to(root), 'Symlink outside repository'
              if p.exists():
                  assert p.is_file() and not p.is_symlink(), 'Unexpected path type: '+name
                  current=hashlib.sha256(p.read_bytes()).hexdigest()
                  assert current in {OLD.get(name),NEW.get(name)}, 'Unreviewed changes; refusing to overwrite: '+name
          for name in OLD.keys()-NEW.keys():
              (root/name).unlink(missing_ok=True)
          for name,body in files.items():
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(body)
              if name.endswith('.command'):p.chmod(0o755)
          # Only stage the verified release paths, not unrelated files or runtime state.
          import subprocess
          paths=list(sorted(set(OLD)|set(NEW)))
          tracked=set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))
          subprocess.run(['git','add','--',*[p for p in paths if p in NEW or p in tracked]],check=True)
          print(json.dumps({'verified_release_files':len(NEW),'removed_legacy_source_files':len(OLD.keys()-NEW.keys()),'private_data_included':False}))

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dependencies and source contracts
        run: |
          npm ci --include=dev
          npm run test:analysis
          npm run test:fidelity
          npm run test:translation
          node scripts/check-language.mjs
          node scripts/check-semantic-regressions.mjs
          npm run test:database
          npm run build
      - name: Commit verified migration
        run: |
          if git diff --cached --quiet; then
            echo 'The verified release is already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Migrate observatory to Next.js, Postgres and verified sessions'
          git push origin HEAD:main
