  "decision_rules": [
    "工作职能与行业、职级、实际劳动体验分开；不凭公司所属行业归类。",
    "岗位名只作线索，正文优先；不凭经理、主管、总监等头衔判断人员管理。",
    "不以独立、抗压等焦点词的出现、责任或权限标签决定职能，避免与H1-H3循环定义。",
    "正文明确指向一个主要职能时填写primary_function；可并列记录secondary_functions，但一份广告不因此变成多份独立观察。",
    "跨多个职能且主次不明时primary_function保留null，并记录mixed_functions_no_stated_priority；不依据词频、条目数量或设想的工时强选主类。",
    "其他是已辨认但不适合前七类的职能；信息不足不是其他，而是primary_function=null并保留原因。",
    "职业与角色都只描述广告写出的安排；没有人员管理条款不证明现实中没有管理职责。",
    "候选规则与人工判定分开保存；未完成100份人工核对前，不把候选映射称为真实职业标签。"
  ],
